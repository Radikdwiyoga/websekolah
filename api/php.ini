; PHP overrides for the Vercel serverless runtime.
; The vercel-php runtime appends these values to its bundled php.ini.

; Laravel needs headroom for Excel/PDF exports.
memory_limit = 512M
max_execution_time = 60
max_input_time = 60

; Vercel Functions reject request bodies larger than ~4.5 MB before PHP runs,
; so keep the upload limits in line with that hard platform limit.
upload_max_filesize = 4M
post_max_size = 8M

; The deployment code is immutable, so compiled PHP does not need revalidation.
opcache.enable = 1
opcache.validate_timestamps = 0
